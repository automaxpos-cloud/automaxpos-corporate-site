name: Deploy Corporate Website to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cpanel
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build production site
        run: npm run build

      - name: Validate site
        run: npm test

      - name: Audit production build
        run: npm run audit

      - name: Validate cPanel FTPS secrets
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub Actions secret is required for production FTPS deployment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          CPANEL_PORT="${CPANEL_PORT:-21}"
          if [ "$CPANEL_PORT" != "21" ]; then
            echo "::warning::CPANEL_PORT is set to '$CPANEL_PORT'. AutoMax cPanel production normally uses explicit FTPS on port 21."
          fi
          echo "Deployment target: AutoMax POS Corporate Website"
          echo "FTP host: $CPANEL_HOST"
          echo "FTP port: $CPANEL_PORT"
          echo "Username: $CPANEL_USERNAME"
          echo "Remote directory: /public_html"

      - name: Write deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          version=$(node -p "require('./package.json').version")
          cat > dist/deployment.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "deployed_at": "$deployed_at",
            "repository": "${{ github.repository }}",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "version": "$version",
            "target_folder": "/public_html",
            "method": "ftps"
          }
          EOF
          echo "deployed_at=$deployed_at" >> "$GITHUB_OUTPUT"

      - name: Install transfer deploy tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy production files over FTPS
        id: deploy
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          set -euo pipefail

          CPANEL_PORT="${CPANEL_PORT:-21}"
          CPANEL_TARGET_FOLDER="/public_html"
          FTPS_REMOTE_PATH="/"
          files_uploaded=$(find dist -type f | wc -l | tr -d ' ')
          bytes_uploaded=$(du -sb dist | awk '{print $1}')
          transfer_log="$(mktemp)"

          echo "Deployment target: AutoMax POS Corporate Website"
          echo "FTP host: $CPANEL_HOST"
          echo "FTP port: $CPANEL_PORT"
          echo "Username: $CPANEL_USERNAME"
          echo "Remote directory: $CPANEL_TARGET_FOLDER"
          echo "FTPS mirror path from FTP login root: $FTPS_REMOTE_PATH"

          if ! lftp -u "$CPANEL_USERNAME","$CPANEL_PASSWORD" -p "$CPANEL_PORT" "ftp://$CPANEL_HOST" >"$transfer_log" 2>&1 <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set net:max-retries 2
          set net:timeout 30
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose --exclude-glob .htaccess --exclude-glob .well-known/ --exclude-glob .well-known/** --exclude-glob owner/ --exclude-glob owner/** --exclude-glob hospitality/ --exclude-glob hospitality/** --exclude-glob cgi-bin/ --exclude-glob cgi-bin/** dist "$FTPS_REMOTE_PATH"
          bye
          LFTP
          then
            cat "$transfer_log"
            rm -f "$transfer_log"
            exit 1
          fi

          cat "$transfer_log"
          rm -f "$transfer_log"

          echo "files_uploaded=$files_uploaded" >> "$GITHUB_OUTPUT"
          echo "bytes_uploaded=$bytes_uploaded" >> "$GITHUB_OUTPUT"
          echo "transfer_method=explicit-ftps:$CPANEL_USERNAME@$CPANEL_HOST:$CPANEL_PORT" >> "$GITHUB_OUTPUT"
          echo "remote_path=$CPANEL_TARGET_FOLDER" >> "$GITHUB_OUTPUT"
          echo "ftps_mirror_path=$FTPS_REMOTE_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --insecure -L -s -o /tmp/automax-home.html -w "%{http_code}" https://automaxpos.com)
          echo "automaxpos.com HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::https://automaxpos.com returned HTTP $status"
            exit 1
          fi

          meta_status=$(curl --insecure -L -s -o /tmp/automax-deployment.json -w "%{http_code}" https://automaxpos.com/deployment.json)
          echo "deployment.json HTTP status: $meta_status"
          if [ "$meta_status" != "200" ]; then
            echo "::error::https://automaxpos.com/deployment.json returned HTTP $meta_status"
            exit 1
          fi
          if ! grep -q "${{ github.sha }}" /tmp/automax-deployment.json; then
            echo "::error::deployment.json does not contain commit ${{ github.sha }}"
            cat /tmp/automax-deployment.json
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## AutoMax POS Corporate Website Deployment"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Production URL: https://automaxpos.com"
            echo "- Deployment method: \`${{ steps.deploy.outputs.transfer_method }}\` mirror of local production build"
            echo "- Remote path: \`${{ steps.deploy.outputs.remote_path }}\`"
            echo "- FTPS mirror path: \`${{ steps.deploy.outputs.ftps_mirror_path }}\`"
            echo "- Files uploaded: \`${{ steps.deploy.outputs.files_uploaded }}\`"
            echo "- Bytes uploaded: \`${{ steps.deploy.outputs.bytes_uploaded }}\`"
            echo "- Validation: build, tests, audit, HTTP 200, deployment metadata"
            echo ""
            echo ".htaccess and .well-known are preserved on the server."
          } >> "$GITHUB_STEP_SUMMARY"
