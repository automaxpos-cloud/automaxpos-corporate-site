name: Deploy Corporate Website to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cpanel
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build production site
        run: npm run build

      - name: Validate site
        run: npm test

      - name: Audit production build
        run: npm run audit

      - name: Validate cPanel SFTP secrets
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_REMOTE_PATH: ${{ secrets.CPANEL_REMOTE_PATH }}
        run: |
          missing=0
          for name in CPANEL_HOST CPANEL_PORT CPANEL_USERNAME CPANEL_PASSWORD CPANEL_REMOTE_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub Actions secret is required for production SFTP deployment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Write deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > dist/deployment.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "deployed_at": "$deployed_at",
            "repository": "${{ github.repository }}",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "method": "sftp"
          }
          EOF
          echo "deployed_at=$deployed_at" >> "$GITHUB_OUTPUT"

      - name: Install transfer deploy tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy production files over SFTP or FTPS
        id: deploy
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_REMOTE_PATH: ${{ secrets.CPANEL_REMOTE_PATH }}
        run: |
          set -euo pipefail

          files_uploaded=$(find dist -type f | wc -l | tr -d ' ')
          bytes_uploaded=$(du -sb dist | awk '{print $1}')
          transfer_method=""
          transfer_log="$(mktemp)"

          attempt_sftp() {
            local host="$1"
            local user="$2"
            local label="sftp:$user@$host:$CPANEL_PORT"
            echo "Attempting $label"
            : > "$transfer_log"
            if lftp -u "$user","$CPANEL_PASSWORD" -p "$CPANEL_PORT" "sftp://$host" >"$transfer_log" 2>&1 <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 30
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose --exclude-glob .htaccess --exclude-glob .well-known/ --exclude-glob .well-known/** dist "$CPANEL_REMOTE_PATH"
          bye
          LFTP
            then
              transfer_method="$label"
              return 0
            fi
            echo "$label failed:"
            cat "$transfer_log"
            return 1
          }

          attempt_ftps() {
            local host="$1"
            local user="$2"
            local label="ftps:$user@$host:21"
            echo "Attempting $label"
            : > "$transfer_log"
            if lftp -u "$user","$CPANEL_PASSWORD" -p 21 "ftp://$host" >"$transfer_log" 2>&1 <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose --exclude-glob .htaccess --exclude-glob .well-known/ --exclude-glob .well-known/** dist "$CPANEL_REMOTE_PATH"
          bye
          LFTP
            then
              transfer_method="$label"
              return 0
            fi
            echo "$label failed:"
            cat "$transfer_log"
            return 1
          }

          public_host="automaxpos.com"
          domain_user="$CPANEL_USERNAME@$public_host"

          if attempt_sftp "$CPANEL_HOST" "$CPANEL_USERNAME" ||
             attempt_sftp "$public_host" "$CPANEL_USERNAME" ||
             attempt_ftps "$CPANEL_HOST" "$CPANEL_USERNAME" ||
             attempt_ftps "$public_host" "$CPANEL_USERNAME" ||
             attempt_ftps "$CPANEL_HOST" "$domain_user" ||
             attempt_ftps "$public_host" "$domain_user"; then
            echo "Deployment transfer succeeded using $transfer_method."
          else
            echo "::error::All cPanel SFTP/FTPS deployment attempts failed."
            rm -f "$transfer_log"
            exit 1
          fi

          cat "$transfer_log"
          rm -f "$transfer_log"

          echo "files_uploaded=$files_uploaded" >> "$GITHUB_OUTPUT"
          echo "bytes_uploaded=$bytes_uploaded" >> "$GITHUB_OUTPUT"
          echo "transfer_method=$transfer_method" >> "$GITHUB_OUTPUT"

      - name: Verify production website
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -L -s -o /tmp/automax-home.html -w "%{http_code}" https://automaxpos.com)
          echo "automaxpos.com HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::https://automaxpos.com returned HTTP $status"
            exit 1
          fi

          meta_status=$(curl -L -s -o /tmp/automax-deployment.json -w "%{http_code}" https://automaxpos.com/deployment.json)
          echo "deployment.json HTTP status: $meta_status"
          if [ "$meta_status" != "200" ]; then
            echo "::error::https://automaxpos.com/deployment.json returned HTTP $meta_status"
            exit 1
          fi
          if ! grep -q "${{ github.sha }}" /tmp/automax-deployment.json; then
            echo "::error::deployment.json does not contain commit ${{ github.sha }}"
            cat /tmp/automax-deployment.json
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## AutoMax POS Corporate Website Deployment"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Production URL: https://automaxpos.com"
            echo "- Deployment method: \`${{ steps.deploy.outputs.transfer_method }}\` mirror of local production build"
            echo "- Remote path: \`${{ secrets.CPANEL_REMOTE_PATH }}\`"
            echo "- Files uploaded: \`${{ steps.deploy.outputs.files_uploaded }}\`"
            echo "- Bytes uploaded: \`${{ steps.deploy.outputs.bytes_uploaded }}\`"
            echo "- Validation: build, tests, audit, HTTP 200, deployment metadata"
            echo ""
            echo ".htaccess and .well-known are preserved on the server."
          } >> "$GITHUB_STEP_SUMMARY"
